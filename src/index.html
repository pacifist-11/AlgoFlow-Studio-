<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlgoFlow-Studio</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: hsl(223, 90%, 10%);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    #preloader .bike {
      display: block;
      width: 10em;
      height: auto;
      color: hsl(223, 90%, 90%);
    }
    #preloader .label {
      margin-top: 1.5rem;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 1rem;
      color: hsl(223, 90%, 70%);
      letter-spacing: 0.05em;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Bike animations */
    .bike__body, .bike__front, .bike__handlebars,
    .bike__pedals, .bike__pedals-spin, .bike__seat,
    .bike__spokes, .bike__spokes-spin, .bike__tire {
      animation: bikeBody 3s ease-in-out infinite;
      stroke: hsl(223, 90%, 60%);
    }
    .bike__front       { animation-name: bikeFront; }
    .bike__handlebars  { animation-name: bikeHandlebars; }
    .bike__pedals      { animation-name: bikePedals; }
    .bike__pedals-spin { animation-name: bikePedalsSpin; }
    .bike__seat        { animation-name: bikeSeat; }
    .bike__spokes      { animation-name: bikeSpokes; stroke: currentColor; }
    .bike__spokes-spin { animation-name: bikeSpokesSpin; }
    .bike__tire        { animation-name: bikeTire; stroke: currentColor; }

    @keyframes bikeBody       { from{stroke-dashoffset:79} 33%,67%{stroke-dashoffset:0} to{stroke-dashoffset:-79} }
    @keyframes bikeFront      { from{stroke-dashoffset:19} 33%,67%{stroke-dashoffset:0} to{stroke-dashoffset:-19} }
    @keyframes bikeHandlebars { from{stroke-dashoffset:10} 33%,67%{stroke-dashoffset:0} to{stroke-dashoffset:-10} }
    @keyframes bikePedals     { from{animation-timing-function:ease-in;stroke-dashoffset:-25.133} 33%,67%{animation-timing-function:ease-out;stroke-dashoffset:-21.991} to{stroke-dashoffset:-25.133} }
    @keyframes bikePedalsSpin { from{transform:rotate(0.1875turn)} to{transform:rotate(3.1875turn)} }
    @keyframes bikeSeat       { from{stroke-dashoffset:5} 33%,67%{stroke-dashoffset:0} to{stroke-dashoffset:-5} }
    @keyframes bikeSpokes     { from{animation-timing-function:ease-in;stroke-dashoffset:-31.416} 33%,67%{animation-timing-function:ease-out;stroke-dashoffset:-23.562} to{stroke-dashoffset:-31.416} }
    @keyframes bikeSpokesSpin { from{transform:rotate(0)} to{transform:rotate(3turn)} }
    @keyframes bikeTire       { from{animation-timing-function:ease-in;stroke-dashoffset:56.549;transform:rotate(0)} 33%{stroke-dashoffset:0;transform:rotate(0.33turn)} 67%{animation-timing-function:ease-out;stroke-dashoffset:0;transform:rotate(0.67turn)} to{stroke-dashoffset:-56.549;transform:rotate(1turn)} }
  </style>
</head>

<body>
  <!-- Bicycle Preloader — visible until React mounts -->
  <div id="preloader">
    <svg class="bike" viewBox="0 0 48 30" width="48px" height="30px">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1">
        <g transform="translate(9.5,19)">
          <circle class="bike__tire" r="9" stroke-dasharray="56.549 56.549" />
          <g class="bike__spokes-spin" stroke-dasharray="31.416 31.416" stroke-dashoffset="-23.562">
            <circle class="bike__spokes" r="5" />
            <circle class="bike__spokes" r="5" transform="rotate(180,0,0)" />
          </g>
        </g>
        <g transform="translate(24,19)">
          <g class="bike__pedals-spin" stroke-dasharray="25.133 25.133" stroke-dashoffset="-21.991" transform="rotate(67.5,0,0)">
            <circle class="bike__pedals" r="4" />
            <circle class="bike__pedals" r="4" transform="rotate(180,0,0)" />
          </g>
        </g>
        <g transform="translate(38.5,19)">
          <circle class="bike__tire" r="9" stroke-dasharray="56.549 56.549" />
          <g class="bike__spokes-spin" stroke-dasharray="31.416 31.416" stroke-dashoffset="-23.562">
            <circle class="bike__spokes" r="5" />
            <circle class="bike__spokes" r="5" transform="rotate(180,0,0)" />
          </g>
        </g>
        <polyline class="bike__seat" points="14 3,18 3" stroke-dasharray="5 5" />
        <polyline class="bike__body" points="16 3,24 19,9.5 19,18 8,34 7,24 19" stroke-dasharray="79 79" />
        <path class="bike__handlebars" d="m30,2h6s1,0,1,1-1,1-1,1" stroke-dasharray="10 10" />
        <polyline class="bike__front" points="32.5 2,38.5 19" stroke-dasharray="19 19" />
      </g>
    </svg>
    <p class="label">Loading AlgoFlow Studio...</p>
  </div>

  <div id="root"></div>
  <script type="module" src="/entry.jsx"></script>
  <script>
    // Hide preloader once React has mounted content into #root
    const observer = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const preloader = document.getElementById('preloader');
        if (preloader) {
          preloader.classList.add('hidden');
          setTimeout(() => preloader.remove(), 650);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });
  </script>
</body>

</html>
