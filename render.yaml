databases:
  - name: algoflow-studio-db
    plan: free # Free tier database
    databaseName: algoflow_studio
    user: postgres

services:
  - type: web
    name: algoflow-studio
    plan: free # Free tier instance
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: algoflow-studio-db
          property: connectionString
      - key: PORT
        value: 10000 # Render's standard web service port
      - key: PGUSER
        value: postgres
      - key: PGDATABASE
        value: algoflow_studio
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
        placeholder: "your_email@gmail.com"
      - key: SMTP_PASS
        sync: false
        placeholder: "your_smtp_app_password"
      - key: ADMIN_PIN
        value: "1234"
